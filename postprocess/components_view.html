<!doctype html>
<!-- Generated by Claude Fable 5 (Anthropic) -->
<html><head><meta charset="utf-8"><title>FISH — Components (Layer B)</title>
<style>
 body{margin:0;font-family:Helvetica,Arial,sans-serif;background:#f4f4f4}
 #panel{position:absolute;left:8px;top:8px;background:#fff;padding:10px 12px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.2);z-index:5;font-size:13px;max-width:420px}
 #panel input[type=text]{width:190px}
 #stage{position:absolute;inset:0;overflow:hidden;cursor:grab}
 #stage-inner{transform-origin:0 0}
 #summary{margin-top:6px;color:#333}
 table.links{border-collapse:collapse;font-size:12px;margin-top:6px}
 table.links td,table.links th{border-bottom:1px solid #eee;padding:2px 6px;text-align:left}
 .kind-data{color:#222}.kind-state{color:#e07b00}.kind-join{color:#1f77b4}.kind-infra{color:#999}
 .small-btn{font-size:12px;padding:1px 6px}
 #legend{position:absolute;right:10px;bottom:10px;background:#fff;padding:6px 10px;border-radius:6px;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
</style></head><body>
<div id="panel">
  <b>FISH — Components (Layer B)</b>
  <div style="margin-top:6px">Session: <input type="text" id="sessionId"> <button id="loadBtn" class="small-btn">Load</button></div>
  <div style="margin-top:4px">
    depth <select id="depth"><option value="1">1 (/sensing)</option><option value="2">2 (/sensing/lidar)</option></select>
    <label><input type="checkbox" id="showInfra"> show infra links</label>
    <label title="/system, /adapi, /viz, root-namespace nodes, /pointcloud_container"><input type="checkbox" id="showCrosscut"> cross-cutting</label>
    <label title="one ext:in/ext:out per component (default) vs single merged nodes"><input type="checkbox" id="mergeExt"> merge ext</label>
    <button class="small-btn" id="fitBtn">Fit</button>
    <a id="tableLink" class="small-btn" target="_blank" style="text-decoration:none;border:1px solid #888;border-radius:3px;padding:1px 6px;color:#1a1a1a;background:#f5f5f5" title="Full sortable/filterable link table (like cb-stats)">Table ↗</a>
  </div>
  <div id="summary">load a session…</div>
  <div id="linkTable"></div>
</div>
<div id="stage"><div id="stage-inner"></div></div>
<div id="legend">
  <span style="color:#222">━ trigger (topics · n instances · hop ⌀ p50)</span> &nbsp;
  <span style="color:#e07b00">┄▷ sampled/state (age p50; dashed = inferred, solid = polled/observed)</span> &nbsp;
  <span style="color:#1f77b4">┈ join</span> &nbsp;
  <span style="color:#bbb">┄ infra</span>
</div>
<script>
const params = new URLSearchParams(location.search);
const sid0 = params.get('session_id') || params.get('session') || '';
if (sid0) document.getElementById('sessionId').value = sid0;
let scale = 1, tx = 20, ty = 20, dragging = false, dx = 0, dy = 0;
const stage = document.getElementById('stage'), inner = document.getElementById('stage-inner');
function apply(){ inner.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; }
stage.addEventListener('wheel', e => { e.preventDefault(); const k = e.deltaY < 0 ? 1.1 : 1/1.1;
  const r = stage.getBoundingClientRect(); const mx = e.clientX - r.left, my = e.clientY - r.top;
  tx = mx - (mx - tx) * k; ty = my - (my - ty) * k; scale *= k; apply(); }, {passive:false});
stage.addEventListener('mousedown', e => { dragging = true; dx = e.clientX - tx; dy = e.clientY - ty; stage.style.cursor='grabbing'; });
window.addEventListener('mouseup', () => { dragging = false; stage.style.cursor='grab'; });
window.addEventListener('mousemove', e => { if (dragging){ tx = e.clientX - dx; ty = e.clientY - dy; apply(); } });
function fit(){ const svg = inner.querySelector('svg'); if (!svg) return;
  const w = svg.width.baseVal.value || svg.viewBox.baseVal.width, h = svg.height.baseVal.value || svg.viewBox.baseVal.height;
  const r = stage.getBoundingClientRect(); scale = Math.min((r.width-40)/w, (r.height-40)/h, 2); tx = 480; ty = 20; apply(); }
function fmt(ns){ if (ns==null) return '–'; return ns < 1e6 ? (ns/1e3).toFixed(0)+' µs' : ns < 1e9 ? (ns/1e6).toFixed(1)+' ms' : (ns/1e9).toFixed(1)+' s'; }
async function load(){
  const sid = document.getElementById('sessionId').value.trim(); if (!sid) return;
  const depth = document.getElementById('depth').value; const infra = document.getElementById('showInfra').checked ? 'show' : 'hide';
  const crosscut = document.getElementById('showCrosscut').checked ? 'show' : 'hide'; const ext = document.getElementById('mergeExt').checked ? 'merge' : 'split';
  document.getElementById('summary').textContent = 'loading…';
  document.getElementById('tableLink').href = `/component-links?session_id=${encodeURIComponent(sid)}&scope=__main__`;
  const r = await fetch(`/api/components-svg?session=${encodeURIComponent(sid)}&depth=${depth}&infra=${infra}&crosscut=${crosscut}&ext=${ext}`);
  if (!r.ok){ document.getElementById('summary').textContent = 'error ' + r.status; return; }
  const d = await r.json();
  inner.innerHTML = (d.svg || '').replace(/<\?xml[^?]*\?>/, '').replace(/<!DOCTYPE[^>]*>/, '');
  fit();
  const nData = d.links.filter(l=>l.kind==='data').length, nState = d.links.filter(l=>l.kind==='state').length, nJoin = d.links.filter(l=>l.kind==='join').length, nInfra = d.links.filter(l=>l.kind==='infra').length;
  document.getElementById('summary').innerHTML = `<b>${d.components.length}</b> components · links: <b>${nData}</b> data, <b>${nState}</b> state, ${nJoin} join, ${nInfra} infra`;
  document.getElementById('linkTable').innerHTML = `<div style="margin-top:6px;color:#555">link table → <a href="/component-links?session_id=${encodeURIComponent(sid)}&scope=__main__" target="_blank">component-links ↗</a></div>`;
}
document.getElementById('loadBtn').addEventListener('click', load);
document.getElementById('sessionId').addEventListener('keydown', e => { if (e.key==='Enter') load(); });
['depth','showInfra','showCrosscut','mergeExt'].forEach(id => document.getElementById(id).addEventListener('change', load));
document.getElementById('fitBtn').addEventListener('click', fit);
if (sid0) load();
</script></body></html>
