<!doctype html>

<html><head><meta charset="utf-8"><title>Open in Perfetto</title>
<style>body{font:15px/1.5 system-ui,sans-serif;margin:2em;max-width:52em}button{font-size:16px;padding:.5em 1em}#log{white-space:pre-wrap;color:#555}</style></head>
<body>
<h2>FISH trace → Perfetto UI</h2>
<p>File: <code id="f"></code></p>
<p><button id="b">Open in Perfetto UI</button> <span id="s"></span></p>
<p id="log"></p>
<script>
// ui.perfetto.dev cannot fetch http://127.0.0.1 itself (mixed content), so this page loads the JSON and hands the
// bytes over with the UI's postMessage protocol: post 'PING' until the UI answers 'PONG', then post {perfetto:{buffer}}.
const q = new URLSearchParams(location.search); const file = q.get('file') || 'trace.json';
document.getElementById('f').textContent = file;
const log = m => { document.getElementById('log').textContent += m + '\n'; };
document.getElementById('b').onclick = async () => {
  const s = document.getElementById('s'); s.textContent = 'loading…';
  const r = await fetch(file); if (!r.ok) { s.textContent = 'fetch failed ' + r.status; return; }
  const buf = await r.arrayBuffer(); s.textContent = (buf.byteLength / 1e6).toFixed(1) + ' MB loaded, opening UI…';
  const ui = 'https://ui.perfetto.dev'; const w = window.open(ui);
  if (!w) { s.textContent = 'popup blocked — allow popups for this page'; return; }
  let done = false;
  const onMsg = e => { if (e.origin === ui && e.data === 'PONG' && !done) { done = true; clearInterval(t);
      w.postMessage({ perfetto: { buffer: buf, title: file, fileName: file } }, ui); s.textContent = 'sent to Perfetto'; } };
  window.addEventListener('message', onMsg);
  const t = setInterval(() => { if (!done) w.postMessage('PING', ui); }, 300);
  setTimeout(() => { if (!done) { clearInterval(t); s.textContent = 'no answer from the UI (still loading?) — click again'; } }, 30000);
};
</script></body></html>
