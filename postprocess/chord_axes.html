<!doctype html>
<!-- Generated by Claude Fable 5 (Anthropic) — full-page, zoomable chord of the three
     abstraction axes (notes/design_abstraction_axes.txt). Toggle OS / ROS / GPU: the
     selected axes share the circle equally (1 → 360°, 2 → 180° each, 3 → 120° each);
     none selected → empty circle.
       arcs     OS  = EX vertices (process-primary executors), sized by CPU execution time
                ROS = namespaces (ns¹ / ns² / node), sized by CPU execution time
                GPU = streams (+ the cpu-only pseudo-class), sized by kernel time
       ribbons  within an axis  = quotient edges of that axis (Layer B links: trigger /
                                  sampled / state; width = message instances, additive)
                between axes    = co-membership of the same execution facts seen from two
                                  axes (a meet cell; width = time, additive)
     Widths are comparable within one colour (one link set), not across colours. -->
<html lang="en"><head><meta charset="utf-8"><title>FISH — axes chord</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  html,body{margin:0;height:100%;font:13px system-ui,sans-serif;color:#1a1a1a;background:#fafafa;overflow:hidden}
  #bar{position:absolute;left:0;top:0;right:0;padding:8px 14px;background:#fff;border-bottom:1px solid #ddd;display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:5}
  #bar input[type=text]{width:200px;font:13px monospace;padding:3px 6px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border:1.5px solid #bbb;border-radius:16px;cursor:pointer;user-select:none;font-weight:600;background:#fff}
  .chip.on{color:#fff}
  .chip.os.on{background:#556b7a;border-color:#556b7a}
  .chip.ros.on{background:#3aa6b0;border-color:#2a7f87}
  .chip.gpu.on{background:#2ca02c;border-color:#1d7a1d}
  #svg{position:absolute;inset:0;top:46px;width:100%;height:calc(100% - 46px);background:#fff;cursor:grab}
  #tip{position:fixed;display:none;background:rgba(25,30,38,.95);color:#fff;padding:6px 9px;border-radius:5px;font-size:12px;pointer-events:none;z-index:10;max-width:440px}
  .note{color:#777;font-size:11.5px}
  #legend{position:absolute;right:12px;bottom:12px;background:rgba(255,255,255,.95);padding:8px 10px;border-radius:6px;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.2);line-height:1.6}
  .sw{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
  .arcLbl{font-size:11px}
</style></head>
<body>
<div id="bar">
  <b>FISH — axes chord</b>
  session <input type="text" id="sid"> <button id="load">Load</button>
  <span class="chip os on" data-axis="OS">OS · executors</span>
  <span class="chip ros on" data-axis="ROS">ROS · namespaces</span>
  <span class="chip gpu on" data-axis="GPU">GPU · streams</span>
  <label>ROS level <select id="rosLvl"><option value="1">ns¹</option><option value="2">ns²</option><option value="3">node</option></select></label>
  <label><input type="checkbox" id="crossc"> cross-cutting ns</label>
  <label><input type="checkbox" id="cpuOnly" checked> GPU: cpu-only class</label>
  <button id="fit">Fit</button>
  <span id="stat" class="note"></span>
</div>
<svg id="svg"></svg>
<div id="tip"></div>
<div id="legend">
  <div><b>within an axis</b> (quotient edges, width = instances)</div>
  <div><span class="sw" style="background:#333"></span>trigger &nbsp; <span class="sw" style="background:#e07b00"></span>sampled / state read</div>
  <div style="margin-top:4px"><b>between axes</b> (co-membership, width = time)</div>
  <div><span class="sw" style="background:#556b7a"></span>OS ⟷ ROS &nbsp; <span class="sw" style="background:#2ca02c"></span>ROS ⟷ GPU &nbsp; <span class="sw" style="background:#9467bd"></span>OS ⟷ GPU</div>
  <div class="note">scroll = zoom · drag = pan · hover = details</div>
</div>
<script>
const qs = new URLSearchParams(location.search);
const scope = qs.get('scope') || '__main__';
document.getElementById('sid').value = qs.get('session_id') || qs.get('session') || '';
const CROSS = new Set(['/system','/adapi','/default_adapi','/viz','/','/pointcloud_container']);
const tip = document.getElementById('tip');
const showTip = (ev, html) => { tip.style.display='block'; tip.style.left=(ev.clientX+12)+'px'; tip.style.top=(ev.clientY+12)+'px'; tip.innerHTML=html; };
const hideTip = () => tip.style.display='none';
const AXES = ['OS','ROS','GPU'];
const sel = new Set(AXES);
let tri = null, comps = {ros:null, os:null, gpu:null};

document.querySelectorAll('.chip').forEach(ch => ch.addEventListener('click', () => {
  const a = ch.dataset.axis; if (sel.has(a)) sel.delete(a); else sel.add(a); ch.classList.toggle('on', sel.has(a)); draw(); }));
['rosLvl','crossc','cpuOnly'].forEach(id => document.getElementById(id).addEventListener('change', () => { if (id==='rosLvl') loadRos().then(draw); else draw(); }));

const svg = d3.select('#svg');
const root = svg.append('g');
const zoom = d3.zoom().scaleExtent([0.3, 12]).on('zoom', ev => root.attr('transform', ev.transform));
svg.call(zoom);
function fit() { const W = svg.node().clientWidth, H = svg.node().clientHeight; const R = Math.min(W,H)/2 - 150;
  svg.transition().duration(300).call(zoom.transform, d3.zoomIdentity.translate(W/2, H/2)); return R; }
document.getElementById('fit').addEventListener('click', fit);

async function loadRos() {
  const sid = document.getElementById('sid').value.trim(); const lvl = document.getElementById('rosLvl').value;
  comps.ros = await fetch(`/api/components?session=${encodeURIComponent(sid)}&scope=${encodeURIComponent(scope)}&depth=${lvl}`).then(r=>r.json()).catch(_=>null);
}
async function load() {
  const sid = document.getElementById('sid').value.trim(); if (!sid) return;
  document.getElementById('stat').textContent = 'loading…';
  const q = `session=${encodeURIComponent(sid)}&scope=${encodeURIComponent(scope)}`;
  const [tr, os, gpu] = await Promise.all([
    fetch(`/api/trisector?session_id=${encodeURIComponent(sid)}&scope=${encodeURIComponent(scope)}`).then(r=>r.json()),
    fetch(`/api/components?${q}&axis=os`).then(r=>r.json()).catch(_=>null),
    fetch(`/api/components?${q}&axis=gpu`).then(r=>r.json()).catch(_=>null),
  ]);
  await loadRos();
  tri = tr; comps.os = os; comps.gpu = gpu;
  draw(); fit();
}
document.getElementById('load').addEventListener('click', load);
document.getElementById('sid').addEventListener('keydown', e => { if (e.key==='Enter') load(); });

// ---------------------------------------------------------------- keys
function rosKeyOf(full, lvl) { if (!full) return '(unresolved)';
  const parts = full.replace(/^\//,'').split('/');
  if (lvl >= 3 || parts.length <= 1) return parts.length <= 1 ? '/' : full;
  return '/' + parts.slice(0, Math.min(lvl, parts.length - 1)).join('/'); }
const osKeyOf = r => 'EX ' + r.pid;          // OS class = the process-primary executor (EX vertex)
const gpuKeyOf = st => 'stream ' + st;

function draw() {
  root.selectAll('*').remove();
  if (!tri) return;
  const lvl = +document.getElementById('rosLvl').value;
  const cc = document.getElementById('crossc').checked;
  const withCpuOnly = document.getElementById('cpuOnly').checked;
  const W = svg.node().clientWidth, H = svg.node().clientHeight; const R = Math.min(W,H)/2 - 150;
  const axes = AXES.filter(a => sel.has(a));
  if (!axes.length) { root.append('circle').attr('r', R).attr('fill','none').attr('stroke','#ddd').attr('stroke-dasharray','6 6');
    root.append('text').attr('text-anchor','middle').attr('fill','#999').attr('font-size',15).text('no axis selected');
    document.getElementById('stat').textContent = ''; return; }

  // ---- facts → keys
  const cb2ros = new Map(), cb2os = new Map(), osLabel = new Map();
  for (const r of tri.cpu) {
    cb2ros.set(r.cb_addr, rosKeyOf(r.node_full, lvl)); cb2os.set(r.cb_addr, osKeyOf(r));
    if (!osLabel.has(osKeyOf(r))) osLabel.set(osKeyOf(r), r.ex_label ? `${r.ex_label}${r.ex_type ? ' · '+r.ex_type + (r.ex_threads && +r.ex_threads>1 ? '('+r.ex_threads+')' : '') : ''}` : ('pid ' + r.pid));
  }
  const keep = k => cc || !CROSS.has(k);
  const agg = (rows, kA, kB, w) => { const m = new Map();
    for (const r of rows) { const a = kA(r), b = kB(r); if (a==null||b==null) continue;
      const k = a+''+b; const cur = m.get(k) || {a,b,w:0,n:0}; cur.w += +w(r); cur.n += +(r.n||1); m.set(k, cur); }
    return [...m.values()]; };
  // cross-axis meets (time-weighted)
  const osros  = agg(tri.cpu, osKeyOf, r=>rosKeyOf(r.node_full, lvl), r=>r.exec_ns).filter(l=>keep(l.b));
  const rosgpu = agg(tri.gpu, r=>cb2ros.get(r.cb_addr)||'(unresolved)', r=>gpuKeyOf(r.stream), r=>r.gpu_ns).filter(l=>keep(l.a));
  const osgpu  = agg(tri.gpu, r=>cb2os.get(r.cb_addr)||('EX '+r.pid), r=>gpuKeyOf(r.stream), r=>r.gpu_ns);
  // intra-axis quotient links (instance-weighted) from the Layer B component graphs
  const intra = (cg, mapKey) => (cg && cg.links ? cg.links : []).filter(l => ['data','sampled','state'].includes(l.kind))
      .filter(l => !l.src.startsWith('ext:') && !l.dst.startsWith('ext:'))
      .map(l => ({a: mapKey(l.src), b: mapKey(l.dst), w: +l.flow_n || +l.n_edges || 0, n: +l.n_edges || 0, kind: l.kind, topics: l.topics||[]}))
      .filter(l => l.a !== l.b && l.w > 0);
  const rosros = intra(comps.ros, k => k).filter(l => keep(l.a) && keep(l.b));
  const osos   = intra(comps.os,  k => k);
  const gpugpu = intra(comps.gpu, k => k).filter(l => withCpuOnly || (l.a !== 'cpu-only' && l.b !== 'cpu-only'));

  // ---- classes + arc weights (time; GPU = kernel time)
  const tot = new Map(); const add = (k,v) => tot.set(k, (tot.get(k)||0) + v);
  for (const l of osros) { add(l.a, l.w); add(l.b, l.w); }
  for (const l of osgpu) add(l.b, l.w);
  const classes = {OS: new Set(), ROS: new Set(), GPU: new Set()};
  for (const l of osros) { classes.OS.add(l.a); classes.ROS.add(l.b); }
  for (const l of osgpu) classes.GPU.add(l.b);
  for (const l of rosros) { classes.ROS.add(l.a); classes.ROS.add(l.b); }
  for (const l of osos) { classes.OS.add(l.a); classes.OS.add(l.b); }
  for (const l of gpugpu) { classes.GPU.add(l.a); classes.GPU.add(l.b); }
  if (!withCpuOnly) classes.GPU.delete('cpu-only');
  const cpuOnlyW = d3.sum(gpugpu.filter(l => l.a==='cpu-only'||l.b==='cpu-only'), l=>l.w);
  if (classes.GPU.has('cpu-only') && !tot.get('cpu-only')) tot.set('cpu-only', Math.max(1, d3.max([...classes.GPU].filter(c=>c!=='cpu-only').map(c=>tot.get(c)||0)) || 1) * 0.35);

  // ---- sectors: equal share of the circle, order OS → ROS → GPU, starting at the left
  const k = axes.length, pad = 0.10, sectors = {};
  axes.forEach((a, j) => { const a0 = -Math.PI + j*2*Math.PI/k + pad/2, a1 = -Math.PI + (j+1)*2*Math.PI/k - pad/2;
    sectors[a] = {range:[a0,a1], classes:[...classes[a]].sort((x,y) => (tot.get(y)||0)-(tot.get(x)||0))}; });
  const color = d3.scaleOrdinal(d3.schemeTableau10.concat(d3.schemeSet3));
  const arcOf = new Map();       // class → {s0,s1,axis}
  for (const a of axes) { const sec = sectors[a]; const [a0,a1] = sec.range; const cpad = 0.012;
    const weights = sec.classes.map(c => Math.max(tot.get(c)||0, 1e-9)); const sum = d3.sum(weights) || 1; let ang = a0;
    sec.classes.forEach((c, i) => { const span = Math.max(0.004, (a1 - a0 - cpad*sec.classes.length) * weights[i] / sum);
      arcOf.set(c, {s0: ang, s1: ang + span, axis: a}); ang += span + cpad; });
    const mid = (a0+a1)/2 - Math.PI/2;
    root.append('text').attr('font-weight',700).attr('font-size',16).attr('fill','#345')
      .attr('transform', `rotate(${mid*180/Math.PI}) translate(${R+118},0) rotate(${-mid*180/Math.PI})`).attr('text-anchor','middle').text(a);
  }
  const lblOf = c => c.startsWith('EX ') ? (osLabel.get(c) || c) : c;
  root.append('g').selectAll('path').data([...arcOf.entries()]).join('path')
    .attr('d', ([c,a]) => d3.arc()({innerRadius:R, outerRadius:R+16, startAngle:a.s0, endAngle:a.s1}))
    .attr('fill', ([c]) => color(c)).attr('stroke','#fff')
    .on('mousemove', (ev,[c,a]) => showTip(ev, `<b>${lblOf(c)}</b><br>${a.axis} class · ${a.axis==='GPU' ? 'kernel' : 'CPU exec'} time ${((tot.get(c)||0)/1e6).toFixed(1)} ms`))
    .on('mouseleave', hideTip);
  root.append('g').selectAll('text').data([...arcOf.entries()]).join('text').attr('class','arcLbl')
    .attr('transform', ([c,a]) => { const m = (a.s0+a.s1)/2 - Math.PI/2; return `rotate(${m*180/Math.PI}) translate(${R+20},0) ${(m>Math.PI/2-0.01||m<-Math.PI/2)?'rotate(180)':''}`; })
    .attr('text-anchor', ([c,a]) => { const m=(a.s0+a.s1)/2 - Math.PI/2; return (m>Math.PI/2-0.01||m<-Math.PI/2) ? 'end':'start'; })
    .text(([c]) => { const l = lblOf(c); return l.length>28 ? l.slice(0,27)+'…' : l; });

  // ---- ribbons: each link gets an angular slot inside both arcs, proportional to its
  //      weight within its link set; an arc splits its span equally among the sets touching it
  const sets = [];
  if (sel.has('ROS')) sets.push({name:'ROS↔ROS', links: rosros, color: l => l.kind==='data' ? '#333' : '#e07b00', unit:'instances', dir:true});
  if (sel.has('OS'))  sets.push({name:'OS↔OS',  links: osos,   color: l => l.kind==='data' ? '#333' : '#e07b00', unit:'instances', dir:true});
  if (sel.has('GPU')) sets.push({name:'GPU↔GPU', links: gpugpu, color: l => l.kind==='data' ? '#333' : '#e07b00', unit:'instances', dir:true});
  if (sel.has('OS') && sel.has('ROS'))  sets.push({name:'OS↔ROS',  links: osros,  color: _ => '#556b7a', unit:'CPU exec time', dir:false});
  if (sel.has('ROS') && sel.has('GPU')) sets.push({name:'ROS↔GPU', links: rosgpu, color: _ => '#2ca02c', unit:'kernel time', dir:false});
  if (sel.has('OS') && sel.has('GPU'))  sets.push({name:'OS↔GPU',  links: osgpu,  color: _ => '#9467bd', unit:'kernel time', dir:false});
  for (const s of sets) s.links = s.links.filter(l => arcOf.has(l.a) && arcOf.has(l.b));
  // per class: which sets touch it and the total weight per set
  const touch = new Map();   // class → Map(setIdx → sumW)
  sets.forEach((s, si) => { for (const l of s.links) for (const c of [l.a, l.b]) { if (!touch.has(c)) touch.set(c, new Map()); const m = touch.get(c); m.set(si, (m.get(si)||0) + l.w); } });
  const cursor = new Map();  // class → Map(setIdx → next angle)
  const slotStart = new Map();
  for (const [c, m] of touch) { const a = arcOf.get(c); const nsets = m.size; const span = (a.s1 - a.s0) / nsets; let ang = a.s0;
    const st = new Map(); for (const si of [...m.keys()].sort()) { st.set(si, {start: ang, span, sum: m.get(si), at: ang}); ang += span; } slotStart.set(c, st); }
  const ribbon = d3.ribbon().radius(R - 3);
  const ribbons = [];
  sets.forEach((s, si) => { for (const l of s.links) {
    const sa = slotStart.get(l.a).get(si), sb = slotStart.get(l.b).get(si);
    const wa = sa.span * l.w / sa.sum, wb = sb.span * l.w / sb.sum;
    ribbons.push({set: s, l, src: {startAngle: sa.at, endAngle: sa.at + wa}, dst: {startAngle: sb.at, endAngle: sb.at + wb}});
    sa.at += wa; sb.at += wb; } });
  root.append('g').attr('fill-opacity', 0.62).selectAll('path').data(ribbons).join('path')
    .attr('d', d => ribbon({source: d.src, target: d.dst}))
    .attr('fill', d => d.set.color(d.l)).attr('stroke', '#fff').attr('stroke-width', 0.3)
    .on('mousemove', (ev, d) => { const l = d.l; const wtxt = d.set.unit.includes('time') ? `${(l.w/1e6).toFixed(1)} ms` : l.w.toLocaleString();
      showTip(ev, `<b>${lblOf(l.a)} ${d.set.dir?'→':'⟷'} ${lblOf(l.b)}</b><br>${d.set.name} · ${l.kind ? (l.kind==='data'?'trigger':l.kind)+' · ' : ''}${d.set.unit}: ${wtxt}` +
        (l.n ? ` · facts/edges: ${l.n.toLocaleString()}` : '') + (l.topics && l.topics.length ? `<br><span style="color:#9db">${l.topics.slice(0,5).join(', ')}</span>` : '')); })
    .on('mouseleave', hideTip);
  document.getElementById('stat').textContent = axes.map(a => `${a}: ${sectors[a].classes.length}`).join(' · ') + ` · ribbons ${ribbons.length}`;
}
window.addEventListener('resize', () => { if (tri) { draw(); } });
if (document.getElementById('sid').value) load();
</script>
</body></html>
