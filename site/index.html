<!doctype html>
<!-- fishiris.com — FISH landing page. Generated by Claude Fable 5 (Anthropic). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FISH — Function-level Inspection of Scheduling Hierarchies</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐟</text></svg>">
<style>
  :root { --ink:#fff; --glass:rgba(6,30,50,.55); --accent:#ffd166; --accent2:#06d6a0; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color:var(--ink);
    background:#062a3e url("bg.jpg") center/cover no-repeat fixed;
    min-height:100vh; display:flex; flex-direction:column;
  }
  body::before { content:""; position:fixed; inset:0; background:linear-gradient(180deg, rgba(0,20,40,.55) 0%, rgba(0,20,40,.15) 35%, rgba(0,20,40,.35) 100%); pointer-events:none; }
  header, main, footer { position:relative; z-index:1; }
  header { display:flex; align-items:center; justify-content:space-between; padding:22px 32px; gap:24px; flex-wrap:wrap; }
  .brand { font-size:clamp(18px, 2.4vw, 30px); font-weight:700; letter-spacing:.3px; text-shadow:0 2px 12px rgba(0,0,0,.6); }
  .brand span { color:var(--accent); }
  nav { display:flex; gap:10px; }
  nav a { color:var(--ink); text-decoration:none; font-size:15px; padding:8px 14px; border:1px solid rgba(255,255,255,.55); border-radius:999px; background:var(--glass); backdrop-filter:blur(6px); transition:background .15s, transform .15s; }
  nav a:hover { background:rgba(255,255,255,.18); transform:translateY(-1px); }
  main { flex:1; padding:6px 32px 32px; }
  .catch { display:inline-flex; flex-direction:column; gap:10px; background:var(--glass); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.35); border-radius:14px; padding:16px 18px; min-width:min(520px, 92vw); box-shadow:0 8px 30px rgba(0,0,0,.35); }
  .catch label { font-size:13px; letter-spacing:.6px; text-transform:uppercase; opacity:.9; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  select { flex:1; min-width:280px; font-size:15px; padding:9px 12px; border-radius:8px; border:1px solid rgba(255,255,255,.5); background:rgba(255,255,255,.92); color:#123; }
  button.go { font-size:16px; font-weight:700; padding:10px 22px; border-radius:999px; border:0; cursor:pointer; background:var(--accent); color:#1b2a38; box-shadow:0 3px 10px rgba(0,0,0,.35); transition:transform .12s, filter .12s; }
  button.go:hover { transform:translateY(-1px) scale(1.02); filter:brightness(1.05); }
  button.go:disabled { opacity:.55; cursor:default; transform:none; }
  .meta { font-size:12.5px; opacity:.9; line-height:1.5; min-height:1.5em; }
  .meta code { background:rgba(255,255,255,.15); padding:1px 5px; border-radius:4px; }
  .links { display:flex; gap:8px; flex-wrap:wrap; }
  .links a { color:var(--accent2); font-size:12.5px; text-decoration:none; border-bottom:1px dotted rgba(6,214,160,.6); }
  .links a:hover { border-bottom-style:solid; }
  .tag { position:fixed; right:18px; bottom:14px; font-size:12px; opacity:.85; text-shadow:0 1px 6px rgba(0,0,0,.8); }
  footer { padding:0 32px 14px; font-size:11.5px; opacity:.85; text-shadow:0 1px 6px rgba(0,0,0,.8); }
  footer a { color:var(--ink); }
</style>
</head>
<body>
<header>
  <div class="brand">FISH: [<span>F</span>]unction-level [<span>I</span>]nspection of [<span>S</span>]cheduling [<span>H</span>]ierarchies</div>
  <nav>
    <a href="https://github.com/FatihTasyaran/FISH_INTERFERE" target="_blank" rel="noopener">GitHub</a>
    <a href="https://fish-interfere.readthedocs.io/en/latest/" target="_blank" rel="noopener">Documentation</a>
    <a href="mailto:f.tasyaran@tue.nl">Contact</a>
  </nav>
</header>

<main>
  <div class="catch">
    <label for="fish">Select your fish</label>
    <div class="row">
      <select id="fish"><option value="">loading sessions…</option></select>
      <button class="go" id="catchBtn" disabled>catch!</button>
    </div>
    <div class="meta" id="meta"></div>
    <div class="links" id="quick"></div>
  </div>

</main>

<footer>Background image taken from <a href="https://www.youtube.com/watch?v=qi0mY6zVQnY" target="_blank" rel="noopener">https://www.youtube.com/watch?v=qi0mY6zVQnY</a></footer>

<script>
// Everything local for now: session list from the FISH viz server, dashboard on local Grafana.
const API      = (location.port === '8783' ? '' : 'http://localhost:8783');
const GRAFANA  = 'http://localhost:3000';
const DASH_UID = 'adq49gh';
const VIZ      = 'http://localhost:8783';
const PAD_S    = 10;
let sessions = [];

function isoMs(ms){ const d = new Date(ms); return d.toISOString().replace(/\.(\d{3})Z$/, '.$1Z'); }
function grafanaUrl(s){
  const from = isoMs(Math.floor(s.start_ts_ns/1e6) - PAD_S*1000), to = isoMs(Math.floor(s.end_ts_ns/1e6) + PAD_S*1000);
  const q = new URLSearchParams({from, to, 'var-session_id': s.session_id, 'var-scope': s.scope || '__main__', orgId: 1, timezone: 'browser'});
  return `${GRAFANA}/d/${DASH_UID}/t0?${q}`;
}
function fmtDur(ns){ if (!ns) return '–'; const s = ns/1e9; return s < 90 ? s.toFixed(0)+' s' : (s/60).toFixed(1)+' min'; }
function fmtWhen(iso){ try { return new Date(iso).toLocaleString(); } catch(e){ return iso || ''; } }
function describe(s){
  const bits = [];
  if (s.start_utc) bits.push(fmtWhen(s.start_utc));
  bits.push(`${fmtDur(s.duration_ns)}`);
  if (s.n_events) bits.push(`${(s.n_events/1e6).toFixed(2)} M events`);
  if (s.n_graph_nodes) bits.push(`${s.n_graph_nodes} graph nodes`);
  if (s.target_image) bits.push(`<code>${s.target_image}</code>`);
  if (s.label) bits.unshift(`<b>${s.label}</b>`);
  return bits.join(' · ');
}
function onPick(){
  const sel = document.getElementById('fish'); const s = sessions.find(x => x.session_id === sel.value);
  const btn = document.getElementById('catchBtn'); btn.disabled = !s;
  document.getElementById('meta').innerHTML = s ? describe(s) : '';
  const q = document.getElementById('quick'); q.innerHTML = '';
  if (s){
    const sid = encodeURIComponent(s.session_id), sc = encodeURIComponent(s.scope || '__main__');
    [['components', `${VIZ}/components?session_id=${sid}&scope=${sc}`],
     ['fish tasks', `${VIZ}/wcc?session_id=${sid}&scope=${sc}`],
     ['gantt', `${VIZ}/gantt-tid?session_id=${sid}&scope=${sc}`],
     ['cb-stats', `${VIZ}/cb-stats?session_id=${sid}&scope=${sc}`],
     ['link table', `${VIZ}/component-links?session_id=${sid}&scope=${sc}`]].forEach(([t,u]) => {
      const a = document.createElement('a'); a.href = u; a.target = '_blank'; a.rel = 'noopener'; a.textContent = t; q.appendChild(a); });
  }
}
async function load(){
  const sel = document.getElementById('fish');
  try {
    const r = await fetch(`${API}/api/sessions`); sessions = await r.json();
  } catch (e) { sel.innerHTML = '<option value="">viz server (:8783) not reachable</option>'; return; }
  sessions.sort((a,b) => (b.start_ts_ns||0) - (a.start_ts_ns||0));
  sel.innerHTML = '<option value="">— pick a session —</option>' + sessions.map(s =>
    `<option value="${s.session_id}">${s.label ? s.label + '  ·  ' : ''}${s.session_id}${s.start_utc ? '  ·  ' + fmtWhen(s.start_utc) : ''}</option>`).join('');
  const pre = new URLSearchParams(location.search).get('session_id'); if (pre) sel.value = pre;
  onPick();
}
document.getElementById('fish').addEventListener('change', onPick);
document.getElementById('catchBtn').addEventListener('click', () => {
  const s = sessions.find(x => x.session_id === document.getElementById('fish').value); if (!s) return;
  window.open(grafanaUrl(s), '_blank', 'noopener');
});
load();
</script>
</body>
</html>
